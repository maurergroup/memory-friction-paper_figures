     760,275.1 764,275.0 768,274.9 772,274.8 776,274.9 780,275.0 784,275.1 788,275.1 792,275.1 796,275.0 800,274.9
    "
    fill="none" stroke="#45A29E" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"
  />

  <!-- ============================================================ -->
  <!-- Bath label — subtle, above the oscillator array              -->
  <!-- ============================================================ -->
  <text x="295" y="333" font-family="sans-serif" font-size="15" font-weight="600"
        letter-spacing="3" fill="#C5C6C7" fill-opacity="0.35" text-anchor="middle" font-style="italic">bath  —  harmonic oscillators</text>

  <!-- ============================================================ -->
  <!-- Oscillator masses — distributed on the surface, left→right   -->
  <!-- ============================================================ -->

  <!-- ω₁: far left, longest spring, warmest (low ω, red noise) -->
  <circle cx="90" cy="275" r="14" fill="url(#glow1)"/>
  <circle cx="90" cy="275" r="5.0" fill="#FF8A65" stroke="#FFCCBC" stroke-width="0.8"/>

  <!-- ω₂ -->
  <circle cx="175" cy="275" r="13" fill="url(#glow2)"/>
  <circle cx="175" cy="275" r="4.7" fill="#FFB74D" stroke="#FFE0B2" stroke-width="0.8"/>

  <!-- ω₃ -->
  <circle cx="260" cy="275" r="12" fill="url(#glow3)"/>
  <circle cx="260" cy="275" r="4.3" fill="#FFF176" stroke="#FFF9C4" stroke-width="0.8"/>

  <!-- ω₄ -->
  <circle cx="345" cy="275" r="11" fill="url(#glow4)"/>
  <circle cx="345" cy="275" r="4.0" fill="#81C784" stroke="#C8E6C9" stroke-width="0.8"/>

  <!-- ω₅ -->
  <circle cx="425" cy="275" r="10.5" fill="url(#glow5)"/>
  <circle cx="425" cy="275" r="3.7" fill="#64B5F6" stroke="#BBDEFB" stroke-width="0.8"/>

  <!-- ω₆: closest to molecule, shortest spring, coolest (high ω, blue/violet noise) -->
  <circle cx="500" cy="275" r="10" fill="url(#glow6)"/>
  <circle cx="500" cy="275" r="3.4" fill="#CE93D8" stroke="#E1BEE7" stroke-width="0.8"/>

  <!-- ============================================================ -->
  <!-- Springs — zigzag from molecule (top-right) to each oscillator -->
  <!-- Colour encodes frequency / coupling strength                  -->
  <!-- ============================================================ -->

  <!-- ω₁: longest spring, warm orange-red, soft coupling -->
  <polyline points="600.0,145.0 576.0,139.8 560.2,166.5 533.5,150.6 517.7,177.3 491.0,161.4 475.2,188.2 448.5,172.3 432.7,199.0 406.0,183.1 390.2,209.8 363.5,193.9 347.7,220.7 321.0,204.8 305.2,231.5 278.5,215.6 262.7,242.3 236.0,226.4 220.2,253.2 193.5,237.3 177.7,264.0 151.0,248.1 135.2,274.8 108.5,258.9 90.0,275.0"
    fill="none" stroke="#FF7043" stroke-opacity="0.70" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ω₂ -->
  <polyline points="600.0,145.0 577.8,141.3 564.3,166.4 539.1,153.2 525.7,178.2 500.5,165.0 487.0,190.0 461.8,176.8 448.4,201.8 423.2,188.6 409.7,213.7 384.6,200.4 371.1,225.5 345.9,212.3 332.5,237.3 307.3,224.1 293.8,249.1 268.7,235.9 255.2,260.9 230.0,247.7 216.6,272.7 191.4,259.5 175.0,275.0"
    fill="none" stroke="#FFA726" stroke-opacity="0.68" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ω₃: intermediate spring, yellow -->
  <polyline points="600.0,145.0 579.8,143.1 569.2,166.4 545.8,156.1 535.2,179.4 511.8,169.1 501.2,192.4 477.8,182.1 467.2,205.4 443.8,195.1 433.2,218.4 409.8,208.1 399.2,231.4 375.8,221.1 365.2,244.4 341.8,234.1 331.2,257.4 307.8,247.1 297.2,270.4 273.8,260.1 260.0,275.0"
    fill="none" stroke="#FDD835" stroke-opacity="0.66" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ω₄: green -->
  <polyline points="600.0,145.0 582.2,145.1 575.3,166.6 553.9,159.5 547.0,181.0 525.5,174.0 518.6,195.5 497.2,188.4 490.3,209.9 468.9,202.9 462.0,224.3 440.5,217.3 433.6,238.8 412.2,231.8 405.3,253.2 383.9,246.2 377.0,267.7 355.5,260.7 345.0,275.0"
    fill="none" stroke="#66BB6A" stroke-opacity="0.68" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ω₅: blue -->
  <polyline points="600.0,145.0 584.9,147.5 582.3,166.9 563.0,163.8 560.4,183.1 541.1,180.0 538.5,199.4 519.3,196.3 516.7,215.6 497.4,212.5 494.8,231.9 475.5,228.8 472.9,248.1 453.6,245.0 451.0,264.4 431.8,261.3 425.0,275.0"
    fill="none" stroke="#42A5F5" stroke-opacity="0.68" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ω₆: shortest spring, violet, stiff coupling -->
  <polyline points="600.0,145.0 588.1,150.6 590.5,167.2 573.8,169.2 576.2,185.8 559.5,187.8 561.9,204.4 545.2,206.3 547.6,222.9 531.0,224.9 533.3,241.5 516.7,243.5 519.0,260.1 502.4,262.1 500.0,275.0"
    fill="none" stroke="#AB47BC" stroke-opacity="0.68" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ============================================================ -->
  <!-- Subtle oscillation arcs at each bath oscillator              -->
  <!-- ============================================================ -->
  <g fill="none" stroke-width="0.9" stroke-opacity="0.30">
    <path d="M  78,262 Q  90,254 102,262" stroke="#FF8A65"/>
    <path d="M 163,262 Q 175,254 187,262" stroke="#FFB74D"/>
    <path d="M 248,262 Q 260,254 272,262" stroke="#FFF176"/>
    <path d="M 334,262 Q 345,254 356,262" stroke="#81C784"/>
    <path d="M 414,262 Q 425,254 436,262" stroke="#64B5F6"/>
    <path d="M 490,262 Q 500,254 510,262" stroke="#CE93D8"/>
  </g>

  <!-- ============================================================ -->
  <!-- Frequency labels — below each oscillator on the surface       -->
  <!-- ============================================================ -->
  <g font-family="sans-serif" font-size="14.0" font-style="italic" text-anchor="middle">
    <text x="90"  y="300" fill="#FF8A65" fill-opacity="0.80">ω₁</text>
    <text x="175" y="300" fill="#FFB74D" fill-opacity="0.80">ω₂</text>
    <text x="260" y="300" fill="#FFF176" fill-opacity="0.80">ω₃</text>
    <text x="345" y="300" fill="#81C784" fill-opacity="0.80">ω₄</text>
    <text x="425" y="300" fill="#64B5F6" fill-opacity="0.80">ω₅</text>
    <text x="500" y="300" fill="#CE93D8" fill-opacity="0.80">ω₆</text>
  </g>

  <!-- ============================================================ -->
  <!-- Adsorbate molecule (the SYSTEM) — top right                   -->
  <!-- ============================================================ -->
  <!-- Subtle "system" label -->
  <text x="600" y="118" font-family="sans-serif" font-size="15" font-weight="600"
        letter-spacing="3" fill="#C5C6C7" fill-opacity="0.35" text-anchor="middle" font-style="italic">system</text>

  <!-- Outer glow -->
  <circle cx="600" cy="145" r="24" fill="url(#adsorbateGlow)"/>
  <!-- Main body — slightly larger for prominence -->
  <circle cx="600" cy="145" r="8" fill="#FF6F00" stroke="#FFB74D" stroke-width="1.4"/>

  <!-- ============================================================ -->
  <!-- Text: MEMORY FRICTION — top left                              -->
  <!-- ============================================================ -->
  <text x="38" y="64" font-family="sans-serif" font-size="32" font-weight="600"
        letter-spacing="8" fill="#FFFFFF" fill-opacity="0.92"
        text-transform="uppercase">MEMORY FRICTION</text>

  <!-- ============================================================ -->
  <!-- Descriptor line — below title                                 -->
  <!-- ============================================================ -->
  <text x="42" y="88" font-family="sans-serif" font-size="11" font-weight="300"
        letter-spacing="2.2" fill="#9FA8DA" fill-opacity="0.48" font-style="italic">system–bath coupling  ·  coloured-noise memory kernel</text>

  <!-- ============================================================ -->
  <!-- Copyright / author — bottom                                   -->
  <!-- ============================================================ -->
  <text x="758" y="368" font-family="sans-serif" font-size="16" font-weight="400"
        letter-spacing="2" fill="#C5C6C7" fill-opacity="0.78" text-anchor="end">© Xuexun Lu</text>

  <!-- ============================================================ -->
  <!-- Subtitle: method — bottom                                     -->
  <!-- ============================================================ -->
  <text x="758" y="388" font-family="sans-serif" font-size="11" font-weight="300"
        letter-spacing="1.2" fill="#45A29E" fill-opacity="0.55" text-anchor="end">GENERALISED LANGEVIN DYNAMICS  ·  NON-MARKOVIAN ELECTRONIC FRICTION</text>

  <!-- ============================================================ -->
  <!-- Decorative: faint energy-level tick marks on left side        -->
  <!-- ============================================================ -->
  <g stroke="#C5C6C7" stroke-opacity="0.10" stroke-width="0.5">
    <line x1="20" y1="200" x2="30" y2="200"/>
    <line x1="20" y1="220" x2="30" y2="220"/>
    <line x1="20" y1="240" x2="30" y2="240"/>
    <line x1="20" y1="260" x2="30" y2="260"/>
    <line x1="20" y1="280" x2="30" y2="280"/>
    <line x1="20" y1="300" x2="30" y2="300"/>
    <line x1="20" y1="320" x2="30" y2="320"/>
  </g>
</svg>
