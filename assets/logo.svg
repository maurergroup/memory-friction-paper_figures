     520,274.8 524,275.0 528,275.2 532,275.3 536,275.2 540,275.0 544,274.8 548,274.7 552,274.8 556,275.0
     560,275.2 564,275.3 568,275.2 572,275.0 576,274.8 580,274.7 584,274.8 588,275.0 592,275.2 596,275.3
