      80,277.5  84,278.7  88,277.7  92,275.0  96,272.3 100,271.0 104,272.1 108,275.0 112,278.0 116,279.3
     120,278.1 124,275.0 128,271.9 132,270.5 136,271.7 140,275.0 144,278.3 148,279.5 152,278.2 156,275.0
