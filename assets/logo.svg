<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Adsorbate glow (system) — top right -->
    <radialGradient id="adsorbateGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6F00" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FF6F00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0"/>
    </radialGradient>

    <!-- Oscillator mass glows — warm to cool (low ω → high ω) -->
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A65" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FF8A65" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB74D" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFB74D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF176" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFF176" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#81C784" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#81C784" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64B5F6" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#64B5F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CE93D8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#CE93D8" stop-opacity="0"/>
    </radialGradient>

    <!-- Spectral gradient for J(ω) legend bar -->
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF7043"/>
      <stop offset="20%"  stop-color="#FFA726"/>
      <stop offset="40%"  stop-color="#FDD835"/>
      <stop offset="60%"  stop-color="#66BB6A"/>
      <stop offset="80%"  stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#AB47BC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="400" fill="#0B0C10"/>

  <!-- ============================================================ -->
  <!-- Surface reference line                                        -->
  <!-- ============================================================ -->
  <line x1="0" y1="275" x2="800" y2="275" stroke="#C5C6C7" stroke-opacity="0.14" stroke-width="0.8" stroke-dasharray="8 12"/>

