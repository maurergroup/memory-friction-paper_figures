     640,274.9 644,274.8 648,274.9 652,275.0 656,275.1 660,275.2 664,275.1 668,275.0 672,274.9 676,274.8
     680,274.9 684,275.0 688,275.1 692,275.2 696,275.1 700,275.0 704,274.9 708,274.8 712,274.9 716,275.0
